<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Amal{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        :root {
        --bg-color: #0d1117;
        --text-color: #f0f6fc;
        --muted-color: #8b949e;
        --card-color: #161b22;
        --nav-color: #010409;
        }

        [data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #212529;
            --muted-color: #6c757d;
            --card-color: #f8f9fa;
            --nav-color: #f8f9fa;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .navbar {
            background: var(--nav-color);
        }

        .project-card {
            background: var(--card-color) !important;
        }

        .card {
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }
        .project-card {
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: #0d6efd !important;
        }
        .theme-text {
            color: var(--text-color) !important;
        }

        .theme-muted {
            color: var(--muted-color) !important;
        }

        .theme-card {
            background-color: var(--card-color) !important;
            color: var(--text-color) !important;
        }

        .theme-nav {
            background-color: var(--nav-color) !important;
        }
        .theme-outline {
            color: var(--text-color) !important;
            border: 1px solid var(--text-color) !important;
        }

        .theme-outline:hover {
            background-color: var(--text-color) !important;
            color: var(--bg-color) !important;
        }

        .project-card {
            background: var(--card-color) !important;
            color: var(--text-color);
            border: 1px solid rgba(128, 128, 128, 0.25);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: #0d6efd;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
        }

        .project-card .project-title {
            color: var(--text-color);
            font-size: 1.25rem;
            font-weight: 700;
        }

        .project-card .project-description {
            color: var(--muted-color);
            line-height: 1.7;
        }

        .project-tech {
            color: var(--muted-color);
            font-size: 0.85rem;
        }

        

    </style>

</head>


<body>

<nav class="navbar navbar-expand-lg theme-nav">

    <div class="container">

        <a class="navbar-brand fw-bold theme-text"
           href="/">
            Amal.
        </a>

        <div>
            <a href="#about"
                class="theme-text  text-decoration-none me-4">
                    About
            </a>
            <a href="#skills"
                class="theme-text  text-decoration-none me-4">
                    Skills
            </a>

            <a href="#projects"
               class="theme-text  text-decoration-none me-4">
                Projects
            </a>

            <a href="https://github.com/kailo-am"
               target="_blank"
               class="theme-text  text-decoration-none">
                GitHub
            </a>
            <button id="themeToggle"
                    class="btn theme-outline btn-sm"
                    type="button"
                    aria-label="Toggle theme">
                    <i id="themeIcon" class="bi bi-sun-fill"></i>
            </button>

        </div>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer class="py-4 mt-5 border-top border-secondary">

    <div class="container text-center">

        <p class="text-secondary mb-0">
            © 2026 Amal. All rights reserved.
        </p>

    </div>

</footer>

<script>
    const themeToggle = document.getElementById("themeToggle");
    const themeIcon = document.getElementById("themeIcon");

    themeToggle.addEventListener("click", () => {

        const currentTheme =
            document.documentElement.getAttribute("data-theme");

        if (currentTheme === "light") {
            document.documentElement.removeAttribute("data-theme");
            themeIcon.className = "bi bi-sun-fill";
        } else {
            document.documentElement.setAttribute("data-theme", "light");
            themeIcon.className = "bi bi-moon-fill";
        }

    });
</script>
</body>

</html>
