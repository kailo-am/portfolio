{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Amal{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          href="{% static 'main/css/style.css' %}">



</head>


<body>

<nav class="navbar navbar-expand-lg theme-nav">

    <div class="container">

        <a class="navbar-brand fw-bold theme-text"
           href="/">
            Amal.
        </a>

        <div>
            <a href="#about"
                class="theme-text  text-decoration-none me-4">
                    About
            </a>
            <a href="#skills"
                class="theme-text  text-decoration-none me-4">
                    Skills
            </a>

            <a href="#projects"
               class="theme-text  text-decoration-none me-4">
                Projects
            </a>

            <a href="https://github.com/kailo-am"
               target="_blank"
               class="theme-text  text-decoration-none">
                GitHub
            </a>
            <button id="themeToggle"
                    class="btn theme-outline btn-sm"
                    type="button"
                    aria-label="Toggle theme">
                    <i id="themeIcon" class="bi bi-sun-fill"></i>
            </button>

        </div>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer class="py-4 mt-5 border-top border-secondary">

    <div class="container text-center">

        <p class="text-secondary mb-0">
            © 2026 Amal. All rights reserved.
        </p>

    </div>

</footer>

<script src="{% static 'main/js/theme.js' %}"></script>
</body>

</html>
